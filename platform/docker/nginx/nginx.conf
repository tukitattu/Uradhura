# ============================================================
# GAMING PLATFORM — NGINX REVERSE PROXY CONFIGURATION
# ============================================================

# Number of worker processes (auto = 1 per CPU core)
worker_processes auto;

# PID file location
pid /var/run/nginx.pid;

# Raise the per-worker fd limit so worker_connections can actually be large.
# MUST also be reflected in the host: `ulimit -n` / /etc/security/limits.conf
# (nofile ≥ 65535) and `fs.file-max` in sysctl.
worker_rlimit_nofile 65535;

# Error log
error_log /var/log/nginx/error.log warn;

events {
    # Hard ceiling for concurrent connections.
    # Default 1024 ≈ 4k total on a 4-core box — far too low for a live games
    # platform (each player also holds a WebSocket). Raise aggressively.
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    # ----------------------------------------------------------
    # Basic Settings
    # ----------------------------------------------------------
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;
    server_tokens off;

    # ----------------------------------------------------------
    # Logging
    # ----------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    '$request_time $upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # ----------------------------------------------------------
    # Gzip Compression
    # ----------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/opentype
        application/vnd.ms-fontobject;
    gzip_min_length 256;
    gzip_disable "msie6";

    # ----------------------------------------------------------
    # Rate Limiting
    # ----------------------------------------------------------
    # General requests: 10 req/sec per IP, burst of 20
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

    # API requests: 30 req/sec per IP, burst of 50
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # Login/auth requests: 5 req/sec per IP, burst of 10
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    # Connection limiting: max 20 concurrent per IP
    limit_conn_zone $binary_remote_addr zone=connlimit:10m;

    # Custom error pages for rate limiting
    limit_req_status 429;
    limit_conn_status 429;

    # ----------------------------------------------------------
    # Upstream Definitions
    # ----------------------------------------------------------
    upstream api_backend {
        server api:4000;
        keepalive 32;
    }

    upstream admin_backend {
        server admin:3001;
        keepalive 16;
    }

    # ----------------------------------------------------------
    # Security Headers (shared across all servers)
    # ----------------------------------------------------------
    map $sent_http_content_type $content_security_policy {
        default "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'";
    }

    # ----------------------------------------------------------
    # Main Server Block
    # NOTE: server_name is temporarily set to the temporary production
    # domain for this build only. Revert to a permanent domain later.
    # ----------------------------------------------------------
    # HTTP only for this temporary build. For permanent HTTPS later, add
    # 'listen 443 ssl;' + cert paths (certbot) and flip the APK to https.
    server {
        listen 80;
        server_name bgwingbangkadesh.com;

        # ----------------------------------------------------------
        # Security Headers
        # ----------------------------------------------------------
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $content_security_policy always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ----------------------------------------------------------
        # Rate Limiting — general
        # ----------------------------------------------------------
        limit_req zone=general burst=20 nodelay;
        limit_conn connlimit 20;

        # ----------------------------------------------------------
        # API Proxy — /api/*
        # ----------------------------------------------------------
        location /api {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://api_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 16k;
            proxy_busy_buffers_size 32k;

            # CORS headers for API
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Max-Age 3600 always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # ----------------------------------------------------------
        # WebSocket Proxy — /ws/*
        # ----------------------------------------------------------
        location /ws {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://api_backend;
            proxy_http_version 1.1;

            # WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket timeouts (longer for persistent connections)
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }

        # ----------------------------------------------------------
        # Socket.io Path — /socket.io/*
        # ----------------------------------------------------------
        location /socket.io {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://api_backend;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }

        # ----------------------------------------------------------
        # Socket.IO Namespaces (/game, /live, /chat, /teen-patti)
        # The player APK/web connects to these at the server ROOT (not
        # under /api/v1). Must be proxied with WebSocket upgrade headers.
        # ----------------------------------------------------------
        location ~ ^/(game|live|chat|teen-patti)$ {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://api_backend;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }

        # ----------------------------------------------------------
        # Auth endpoints — stricter rate limiting
        # ----------------------------------------------------------
        location /api/auth {
            limit_req zone=auth burst=10 nodelay;

            proxy_pass http://api_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------------
        # Admin Panel — / (default)
        # ----------------------------------------------------------
        location / {
            proxy_pass http://admin_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Next.js needs these for SSR
            proxy_buffering off;
            proxy_cache off;
        }

        # ----------------------------------------------------------
        # Next.js static assets (/_next/*)
        # ----------------------------------------------------------
        location /_next/static {
            proxy_pass http://admin_backend;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # ----------------------------------------------------------
        # Health check endpoint
        # ----------------------------------------------------------
        location /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # ----------------------------------------------------------
        # Block hidden files
        # ----------------------------------------------------------
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
